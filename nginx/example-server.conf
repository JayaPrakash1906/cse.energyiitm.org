# Example only: how cil-cse-site.conf fits in. Keep the server's existing
# listen, server_name and SSL certificate lines, and its existing root path.

server {
    # Keep the existing listen lines. www.energyiitm.org's certificate is from
    # AWS Certificate Manager, so TLS most likely ends at a load balancer and
    # nginx listens on plain HTTP behind it (for example `listen 80;`). Keep any
    # ssl_certificate lines that are already here; do not add new ones.
    server_name energy.iitm.ac.in www.energyiitm.org cse.energyiitm.org;

    root /var/www/cil-cse;        # the folder that holds index.html (use the existing path)
    include snippets/cil-cse-site.conf;
}

# Optional, recommended once the new site is live: send the other addresses to
# the main one with a permanent redirect, so search engines see one website.
# CAUTION: energy.iitm.ac.in appears to reach this server through IIT Madras'
# own proxy. First check which Host header that proxy sends (see HANDOVER.md);
# if it sends www.energyiitm.org, this block would loop. In that case leave the
# domains as they are: the canonical tags already point to https://energy.iitm.ac.in/.
#
