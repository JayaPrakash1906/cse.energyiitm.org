# CIL Centre for Sustainable Energy: rules for the static website.
# Generated by AWS Deploy/make_aws.py. Include this file inside the server { }
# block(s) that serve the site, after `root` (see example-server.conf):
#     include snippets/cil-cse-site.conf;
#
# Main address: https://energy.iitm.ac.in/ . Every page is a real file: /about/ is
# /about/index.html, and unknown addresses get the site's 404 page with a 404
# status. This replaces the old single-page app's fallback to /index.html
# (`try_files $uri /index.html;`), which must be removed.

index index.html;
absolute_redirect off;   # /about -> /about/ as a relative redirect (correct behind a proxy)
server_tokens off;
charset utf-8;

gzip on;
gzip_vary on;
gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/manifest+json application/ld+json;

error_page 404 /404.html;

# A static site only needs GET (and HEAD); refuse anything else.
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

location / {
    include snippets/cil-cse-headers.conf;
    try_files $uri $uri/ =404;
}

# security.txt (RFC 9116) and other well-known files.
location ^~ /.well-known/ {
    include snippets/cil-cse-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/plain;
    try_files $uri =404;
}

# Never serve hidden files (.git, .env and the like) if any reach the folder.
location ~ /\. {
    return 404;
}

# Pages, sitemap and robots.txt: always fresh.
location ~* \.(?:html|xml|txt|webmanifest)$ {
    include snippets/cil-cse-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# CSS and JavaScript carry a content hash in their names: cache for a year.
location ~* ^/assets/.+\.(?:css|js)$ {
    include snippets/cil-cse-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Images and fonts: cache for 30 days.
location /assets/ {
    include snippets/cil-cse-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
